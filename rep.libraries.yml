rdf_graph_editor:
  version: 1.x
  js:
    # 1) CodeMirror
    https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js:
      type: external
      minified: true
      weight: -30
    https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/turtle/turtle.min.js:
      type: external
      minified: true
      weight: -29

    # 2) N3.js parser
    https://unpkg.com/n3/browser/n3.min.js:
      type: external
      minified: true
      weight: -20

    # 3) Cytoscape.js
    https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.25.2/cytoscape.min.js:
      type: external
      minified: true
      weight: -10

    # 4) Nosso init - como módulo para podermos usar import()
    js/rdf-graph-editor.js:
      attributes:
        type: module

  css:
    theme:
      # estilo base do CodeMirror
      https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css:
        type: external

  dependencies:
    - core/drupalSettings
    - core/jquery

