    element: '[A-Za-z0-9\-_]+'
    image: '[A-Za-z0-9\-_]+'
  methods: [GET]

rep.api_document:
  path: '/rep/api-document/{element}/{document}'
  defaults:
    _controller: '\Drupal\rep\Controller\ApiDocumentController::document'
  requirements:
    _role: 'authenticated'
    element: '[A-Za-z0-9\-_]+'
    document: '[A-Za-z0-9\-_]+'
  methods: [GET]

rep.contributors.cards:
  path: '/rep/contributors/cards'
  defaults:
    _controller: '\Drupal\rep\Controller\ContributorsController::cards'
  requirements:
    _permission: 'access content'
  methods: [POST]
  options:
    no_cache: TRUE

rep.mt_list_element:
  path: 'rep/mtlist/{elementtype}/{keyword}/{page}/{pagesize}'
  defaults:
    _form: '\Drupal\rep\Form\MTListForm'
    elementtype: 'ins'
    keyword: ''
    page: 1
    pagesize: 9
  requirements:
    _permission: 'access content'
    _custom_access_check: 'TRUE'
  options:
    no_cache: 'TRUE'

rep.icons_explanation:
  path: 'rep/icons-explanation'
  defaults:
    _form: '\Drupal\rep\Form\IconsExplanationForm'
    _title: 'Icons Explanation'
  requirements:
    _permission: 'access content'

rep.file_download:
  path: '/rep/file/{fid}/download'
  defaults:
    _controller: '\Drupal\rep\Controller\FileDownloadController::download'
    _title: 'Download file'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

# Faceted Value Search
rep.faceted_results:
  path: '/rep/valuesearch/faceted/{page}/{pagesize}'
  defaults:
    _form: '\Drupal\rep\Form\ValueSearch\FacetedForm'
    _title: 'Faceted Value Search Results'
    page: 1
    pagesize: 20
  requirements:
    _permission: 'access content'
  options:
    parameters:
      page:
        type: 'integer'
      pagesize:
        type: 'integer'

