name: Run Selenium Tests

on:
  push:
    branches:
      - DEV_V0.9.3
  pull_request:
    branches:
      - DEV_V0.9.3

jobs:
  run-selenium-tests:
    runs-on: self-hosted
    timeout-minutes: 60  # Adiciona timeout global para o job

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # Alterado para OpenJDK 11
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip xvfb google-chrome-stable

      - name: Get Chrome version and download matching ChromeDriver
        run: |
          # Obtém a versão do Chrome instalado
          CHROME_VERSION=$(google-chrome --version | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+")
          echo "Chrome version: $CHROME_VERSION"
          
          # Extrai a versão major
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d'.' -f1)
          echo "Chrome major version: $CHROME_MAJOR_VERSION"
          
          # Prepara diretório
          sudo mkdir -p /var/data/chromedriver
          sudo chown -R $(whoami):$(whoami) /var/data
          cd /var/data/chromedriver
          
          # Download do ChromeDriver compatível
          wget --no-verbose --show-progress "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" || \
          wget --no-verbose --show-progress "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR_VERSION}/chromedriver_linux64.zip"
          
          # Extrai e configura
          if [ -f "chromedriver-linux64.zip" ]; then
            unzip -q chromedriver-linux64.zip
            mv chromedriver-linux64/chromedriver ./chromedriver
            rm -rf chromedriver-linux64.zip chromedriver-linux64
          else
            unzip -q chromedriver_linux64.zip
          fi
          
          chmod +x chromedriver
          echo "/var/data/chromedriver" >> $GITHUB_PATH
          
          # Verifica se o chromedriver funciona
          ./chromedriver --version

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 5

      - name: Wait for hascogui to be ready
        run: |
          timeout 300 bash -c 'until curl -s http://18.203.69.17:80/ > /dev/null; do
            echo "Waiting for hascogui environment to start..."
            sleep 5
          done'

      - name: Run Maven test (specific class)
        timeout-minutes: 45  # Timeout específico para os testes
        run: |
          export DISPLAY=:99
          export MAVEN_OPTS="-Xmx2g -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions"
          mvn -B test -Dtest=tests.A1.FullSetupWSandNHANES \
            -Dmaven.test.failure.ignore=false \
            -Dsurefire.timeout=2700 \
            -Dsurefire.rerunFailingTestsCount=0

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const prAuthor = context.payload.pull_request?.user?.login || "unknown";
            const message = `❌ The tests have failed! @${prAuthor}, please check the logs and fix the problems before merging.`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            })

      - name: Notify via Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ The tests for the PR #${{ github.event.pull_request.number }} have failed. Author: @${{ github.event.pull_request.user.login }}. Check the details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ The tests for the PR #${{ github.event.pull_request.number }} have passed! Author: @${{ github.event.pull_request.user.login }}. Check the details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}